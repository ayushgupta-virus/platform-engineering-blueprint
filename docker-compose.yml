version: '3.9'

# Local dev stack: app + postgres. Mirrors the Azure topology (app -> managed pg).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appuser -d appdb']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    environment:
      PORT: 3000
      APP_ENV: local
      PGHOST: db
      PGPORT: 5432
      PGUSER: appuser
      PGPASSWORD: appsecret
      PGDATABASE: appdb
      PGSSLMODE: disable
    command: sh -c "node src/migrate.js && node src/server.js"
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
