apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: app
  labels:
    app: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo-api
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: todo-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Run an init container to apply DB migrations before the app starts.
      initContainers:
        - name: migrate
          image: todo-api # replaced by kustomize image tag
          command: ["node", "src/migrate.js"]
          envFrom:
            - configMapRef:
                name: todo-api-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-api-db
                  key: PGPASSWORD
      containers:
        - name: todo-api
          image: todo-api # replaced by kustomize image tag
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-api-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-api-db
                  key: PGPASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: todo-api-kv
