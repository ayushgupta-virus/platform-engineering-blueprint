# Secrets Store CSI driver: mounts Key Vault secrets and syncs them to a
# Kubernetes Secret consumed by the Deployment. Uses AKS workload identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: todo-api-kv
  namespace: app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACED_BY_OVERLAY"        # workload identity client id
    keyvaultName: "REPLACED_BY_OVERLAY"
    tenantId: "REPLACED_BY_OVERLAY"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: todo-api-db
      type: Opaque
      data:
        - objectName: db-password
          key: PGPASSWORD
