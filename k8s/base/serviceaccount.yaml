# Service account bound to the Azure workload identity (client id patched by
# each overlay). Lets the Secrets Store CSI driver pull secrets from Key Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-api
  namespace: app
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "REPLACED_BY_OVERLAY"
